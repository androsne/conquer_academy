<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Academia Conquer Blocks - Registro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header>
      <figure>
        <img
          src="./src/assets/icons/logo_conquer.png"
          alt="Logotipo de Conquer Blocks"
        />
      </figure>
      <nav>
        <button id="menu-btn" class="burger-menu" aria-label="Abrir menú">
          <svg
            width="32"
            height="32"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <ul id="nav-list">
          <li><a href="index.html">Home</a></li>
          <li><a href="quienes_somos.html">Quiénes somos</a></li>
          <li><a href="cursos.html">Cursos</a></li>
          <li><a href="blog.html">Blog</a></li>
          <li><strong>Registro</strong></li>
          <li><a href="login.html">Login</a></li>
          <li><a href="contacto.html">Contacto</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section
        class="form card card-white"
        style="max-width: 600px; margin: 40px auto"
      >
        <h1>Formulario de registro</h1>
        <p>
          Por favor, completa el siguiente formulario para registrarte en la
          academia:
        </p>

        <form
          class="registro-form"
          method="POST"
          action=""
          enctype="multipart/form-data"
        >
          <div class="form-group">
            <label for="nombre">Nombre completo:</label>
            <input
              type="text"
              id="nombre"
              name="nombre"
              placeholder="Juan Perez"
              required
            />
          </div>

          <div class="form-group">
            <label for="fecha_nacimiento">Fecha de nacimiento:</label>
            <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" />
          </div>

          <div class="form-group">
            <label for="email">Email:</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="ejemplo@correo.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="direccion">Dirección:</label>
            <input type="text" id="direccion" name="direccion" />
          </div>
          <div class="form-group">
            <label for="pagina_web">Página web:</label>
            <input type="url" id="pagina_web" name="pagina_web" />
          </div>
          <div class="form-group">
            <label for="foto">Foto:</label>
            <input type="file" id="foto" name="foto" />
          </div>
          <div class="form-group">
            <label for="biografia">Biografía:</label>
            <textarea
              id="biografia"
              name="biografia"
              cols="50"
              rows="5"
            ></textarea>
          </div>

          <button class="btn" type="submit">Registrarse</button>
        </form>
      </section>
    </main>

    <footer class="footer">
      <p>
        Conquer Blocks 2026 ®
        <strong><a class="link" href="aviso_legal.html">Aviso Legal</a></strong>
      </p>
    </footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
